
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - BooksAtTheBack</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- NAVIGATION BAR -->
    <header>
        <h2>BooksAtTheBack</h2>

        <nav>
            <a href="index.html">
                <i class="fas fa-house"></i> Home
            </a>

            <a href="index.html#books">
                <i class="fas fa-book"></i> Browse Books
            </a>

            <a href="orders.html" class="active">
                <i class="fas fa-shopping-cart"></i>
                Orders <span id="orderCount">0</span>
            </a>

            <a href="about.html">
                <i class="fas fa-circle-info"></i> About
            </a>
        </nav>

        <a href="login.html" class="login-btn">
            <i class="fas fa-user"></i> Login
        </a>
    </header>


    <!-- SHOPPING CART -->
    <main class="cart-page">

        <!-- CART HEADING -->
        <div class="cart-heading">
            <i class="fas fa-cart-shopping"></i>

            <div>
                <h1>Shopping Cart</h1>
                <p>Your selected books</p>
            </div>
        </div>


        <!-- CART ITEMS -->
        <div id="cartItems"></div>


        <!-- CART SUMMARY -->
        <div class="cart-bottom">

            <h2>
                Subtotal:
                <span id="cartSubtotal">₱0.00</span>
            </h2>

            <div class="cart-actions">

                <!-- CONTINUE SHOPPING -->
                <a href="index.html#books" class="continue-btn">
                    <i class="fas fa-arrow-left"></i>
                    Continue Shopping
                </a>

                <!-- PROCEED TO CHECKOUT -->
                <button
                    type="button"
                    class="checkout-btn"
                    onclick="checkout()">

                    <i class="fas fa-credit-card"></i>
                    Proceed to Checkout

                </button>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer>
        <h2>BooksAtTheBack</h2>
        <p>Books make a better tomorrow.</p>
    </footer>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
